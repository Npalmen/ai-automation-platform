name: Regression PR

on:
  pull_request:

jobs:
  h1-fast-gate:
    name: H1 PR fast gate
    runs-on: ubuntu-latest
    env:
      ENV: test
      CONTINUOUS_REGRESSION_TIER: pr_fast
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect changed paths
        run: python scripts/ci/collect_regression_changed_paths.py --base-ref origin/${{ github.base_ref }} --output changed-paths.json

      - name: Run H1 continuous regression
        run: |
          python -m app.evaluation.regression.runner \
            --tier pr_fast \
            --trigger pull_request \
            --changed-paths-file changed-paths.json \
            --report-json continuous-regression-pr.json \
            --report-markdown continuous-regression-pr.md

      - uses: actions/upload-artifact@v4
        with:
          name: continuous-regression-pr
          path: |
            continuous-regression-pr.json
            continuous-regression-pr.md

  h2-postgres-gate:
    name: H2 PR PostgreSQL gate
    runs-on: ubuntu-latest
    needs: h1-fast-gate
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform
      EVAL_HARNESS_PG_ALLOWED: yes
      EVAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform_eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Provision PostgreSQL eval database
        run: python scripts/ci/provision_eval_pg_database.py

      - name: Run H2 continuous regression
        run: |
          python -m app.evaluation.regression.runner \
            --tier main_pg \
            --trigger pull_request_pg \
            --report-json continuous-regression-pr-pg.json \
            --report-markdown continuous-regression-pr-pg.md

      - uses: actions/upload-artifact@v4
        with:
          name: continuous-regression-pr-pg
          path: |
            continuous-regression-pr-pg.json
            continuous-regression-pr-pg.md
