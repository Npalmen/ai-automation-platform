name: Production pilot P1 qualification

on:
  workflow_dispatch:

jobs:
  p1-qualification:
    runs-on: ubuntu-latest
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Production pilot P1 contract tests
        run: python -m pytest -q tests/production_pilot/

      - name: P1 activation config
        run: python scripts/production_pilot/activate_p1.py --backup-reference backup-ci-p1

      - name: Formal P1 synthetic preflight
        run: python scripts/production_pilot/p1_preflight.py --backup-reference backup-ci-p1

      - name: Formal P1 evaluation
        run: python scripts/production_pilot/p1_evaluation.py --backup-reference backup-ci-p1

      - uses: actions/upload-artifact@v4
        with:
          name: production-pilot-p1-qualification
          path: |
            storage/status/production-pilot/p1-activation.json
            storage/status/production-pilot/p1-preflight.json
            storage/status/production-pilot/p1-preflight.md
            storage/status/production-pilot/p1-evaluation.json
            storage/status/production-pilot/p1-result.md
