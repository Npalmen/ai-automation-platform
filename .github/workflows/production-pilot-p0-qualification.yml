name: Production pilot P0 qualification

on:
  workflow_dispatch:

jobs:
  p0-qualification:
    runs-on: ubuntu-latest
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Production pilot contract tests
        run: python -m pytest -q tests/production_pilot/

      - name: Build release manifest
        run: python scripts/production_pilot/build_release_manifest.py --backup-reference backup-ci-p0

      - name: Provision pilot tenant baseline
        run: python scripts/production_pilot/provision_pilot_tenant.py

      - name: Formal P0 preflight
        run: python scripts/production_pilot/p0_preflight.py --backup-reference backup-ci-p0

      - uses: actions/upload-artifact@v4
        with:
          name: production-pilot-p0-qualification
          path: |
            storage/status/production-pilot/release-manifest.json
            storage/status/production-pilot/pilot-tenant-baseline.json
            storage/status/production-pilot/p0-preflight.json
            storage/status/production-pilot/p0-preflight.md
