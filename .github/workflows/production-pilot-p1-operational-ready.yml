name: Production pilot P1 operational ready

on:
  workflow_dispatch:

jobs:
  p1-operational-ready:
    runs-on: ubuntu-latest
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Production pilot observability tests
        run: python -m pytest -q tests/production_pilot/

      - name: Build release manifest
        run: python scripts/production_pilot/build_release_manifest.py --activation-stage P1 --backup-reference backup-ci-p1-ops

      - name: Register P1 operational ready
        run: python scripts/production_pilot/p1_operational_ready.py --backup-reference backup-ci-p1-ops

      - uses: actions/upload-artifact@v4
        with:
          name: production-pilot-p1-operational-ready
          path: |
            storage/status/production-pilot/p1-operational-ready.json
            storage/status/production-pilot/release-manifest.json
