name: Regression Main

on:
  push:
    branches:
      - main

jobs:
  h1-fast-gate:
    name: H1 main fast gate
    runs-on: ubuntu-latest
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run H1 continuous regression
        run: |
          python -m app.evaluation.regression.runner \
            --tier pr_fast \
            --trigger main_push \
            --report-json continuous-regression-main-h1.json \
            --report-markdown continuous-regression-main-h1.md

  h2-postgres-gate:
    name: H2 main PostgreSQL gate
    runs-on: ubuntu-latest
    needs: h1-fast-gate
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform
      EVAL_HARNESS_PG_ALLOWED: yes
      EVAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform_eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Provision PostgreSQL eval database
        run: python scripts/ci/provision_eval_pg_database.py

      - name: Bootstrap PostgreSQL schema
        run: python -m scripts.ci.bootstrap_postgres_schema

      - name: Run H2 continuous regression
        run: |
          python -m app.evaluation.regression.runner \
            --tier main_pg \
            --trigger main_push \
            --report-json continuous-regression-main-h2.json \
            --report-markdown continuous-regression-main-h2.md

      - uses: actions/upload-artifact@v4
        with:
          name: continuous-regression-main-h2
          path: |
            continuous-regression-main-h2.json
            continuous-regression-main-h2.md
