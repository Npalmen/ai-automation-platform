name: Customer domain F2 qualification

on:
  workflow_dispatch:

jobs:
  f2-campaign:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform
      ENV: test
      EVAL_HARNESS_PG_ALLOWED: yes
      EVAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform_customer_domain_eval
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Provision PostgreSQL eval database
        run: python scripts/ci/provision_eval_pg_database.py

      - name: Formal F2a TBF2 shadow domain campaign
        run: |
          python -m app.evaluation.customer_domain.runner \
            --campaign tbf2 \
            --database-url "$EVAL_DATABASE_URL" \
            --report-json customer-card-shadow-f2a-rg-f2-20260729.json \
            --report-markdown customer-card-shadow-f2a-rg-f2-20260729.md

      - name: Formal F2b mock-intake pipeline campaign
        run: |
          python -m app.evaluation.customer_domain.runner \
            --campaign tbf2b \
            --database-url "$EVAL_DATABASE_URL" \
            --report-json customer-card-shadow-f2b-rg-f2-20260729.json \
            --report-markdown customer-card-shadow-f2b-rg-f2-20260729.md

      - name: F1 regression (TBF campaign)
        run: |
          python -m pytest -q tests/evaluation/customer_domain/test_tbf_campaign_pg.py \
            --junitxml=f1-tbf-regression.junit.xml

      - uses: actions/upload-artifact@v4
        with:
          name: customer-domain-f2-qualification
          path: |
            customer-card-shadow-f2a-rg-f2-20260729.json
            customer-card-shadow-f2a-rg-f2-20260729.md
            customer-card-shadow-f2b-rg-f2-20260729.json
            customer-card-shadow-f2b-rg-f2-20260729.md
            f1-tbf-regression.junit.xml
