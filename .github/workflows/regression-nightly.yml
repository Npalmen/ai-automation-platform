name: Regression Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  h3-nightly:
    name: H3 nightly full regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform
      EVAL_HARNESS_PG_ALLOWED: yes
      EVAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform_eval
      CONTINUOUS_REGRESSION_EXTERNAL_WRITE_BUDGET: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Provision PostgreSQL eval database
        run: python scripts/ci/provision_eval_pg_database.py

      - name: Bootstrap PostgreSQL schema
        run: python -m scripts.ci.bootstrap_postgres_schema

      - name: Run H3 nightly continuous regression
        run: |
          python -m app.evaluation.regression.runner \
            --tier nightly \
            --trigger nightly \
            --run-id rg-h-nightly-${{ github.run_id }} \
            --report-json continuous-regression-nightly.json \
            --report-markdown continuous-regression-nightly.md

      - uses: actions/upload-artifact@v4
        with:
          name: continuous-regression-nightly
          path: |
            continuous-regression-nightly.json
            continuous-regression-nightly.md
