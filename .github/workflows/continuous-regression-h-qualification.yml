name: Continuous regression H qualification

on:
  workflow_dispatch:

jobs:
  h-qualification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform
      EVAL_HARNESS_PG_ALLOWED: yes
      EVAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform_eval
      CONTINUOUS_REGRESSION_EXTERNAL_WRITE_BUDGET: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Provision PostgreSQL eval database
        run: python scripts/ci/provision_eval_pg_database.py

      - name: Bootstrap PostgreSQL schema
        run: python -m scripts.ci.bootstrap_postgres_schema

      - name: Hermetic regression contract tests
        run: python -m pytest -q tests/evaluation/regression/

      - name: Formal H1 dry-run registry gate
        run: |
          python -m app.evaluation.regression.runner \
            --tier pr_fast \
            --trigger qualification \
            --run-id rg-h-qual-h1-${{ github.run_id }} \
            --dry-run \
            --report-json testbot-h-continuous-regression-h1.json \
            --report-markdown testbot-h-continuous-regression-h1.md

      - name: Formal H3 continuous regression campaign
        run: |
          python -m app.evaluation.regression.runner \
            --tier nightly \
            --trigger qualification \
            --run-id rg-h-qual-${{ github.run_id }} \
            --report-json testbot-h-continuous-regression-rg-h-20260729.json \
            --report-markdown testbot-h-continuous-regression-rg-h-20260729.md

      - name: H4 manual live workflow isolation contract
        run: python -m pytest -q tests/evaluation/regression/test_tbr_scenarios.py::test_tbr20_manual_live_workflow_has_no_schedule

      - uses: actions/upload-artifact@v4
        with:
          name: continuous-regression-h-qualification
          path: |
            testbot-h-continuous-regression-h1.json
            testbot-h-continuous-regression-h1.md
            testbot-h-continuous-regression-rg-h-20260729.json
            testbot-h-continuous-regression-rg-h-20260729.md
