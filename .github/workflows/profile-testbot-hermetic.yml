name: Profile testbot hermetic qualification

on:
  workflow_dispatch:

jobs:
  profile-testbot-hermetic:
    runs-on: ubuntu-latest
    env:
      ENV: test
      LIVE_EVAL_ALLOWED: yes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Profile testbot unit tests
        run: python -m pytest -q tests/evaluation/profile_testbot/

      - name: Hermetic profile campaign
        run: python scripts/run_profile_testbot_campaign.py hermetic --profile-id pilot-service-company-v1
