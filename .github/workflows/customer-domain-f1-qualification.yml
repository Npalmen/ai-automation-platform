name: Customer domain F1 qualification

on:
  workflow_dispatch:

jobs:
  f1-campaign:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform
      ENV: test
      EVAL_HARNESS_PG_ALLOWED: yes
      EVAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_platform_customer_domain_eval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b433cba679bbc944d38faf128e651c1ad9de4f43

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Provision PostgreSQL eval database
        run: python scripts/ci/provision_eval_pg_database.py

      - name: Readiness check
        run: python scripts/customer_domain_stateful_readiness.py --database-url "$EVAL_DATABASE_URL"

      - name: Formal F1 TBF campaign
        run: |
          python -m app.evaluation.customer_domain.runner \
            --campaign tbf \
            --database-url "$EVAL_DATABASE_URL" \
            --report-json customer-card-stateful-f1-rg-f1-20260729.json \
            --report-markdown customer-card-stateful-f1-rg-f1-20260729.md

      - name: F1b HTTP contract tests
        run: |
          python -m pytest -q tests/evaluation/customer_domain/test_tbf_http_contract_pg.py \
            --junitxml=f1b-http-contract.junit.xml

      - name: HTTP identity create supplement
        run: |
          python - <<'PY'
          import importlib
          import os
          from unittest.mock import patch
          from fastapi.testclient import TestClient
          from sqlalchemy.orm import sessionmaker
          from app.api.dependencies import get_db
          from app.core.settings import get_settings
          from app.evaluation.customer_domain.db import cleanup_eval_tenants, ensure_eval_tenant, initialize_database
          from tests.helpers.customer_domain_eval_pg import eval_engine

          os.environ["END_CUSTOMER_READ_API_ENABLED"] = "true"
          os.environ["END_CUSTOMER_WRITE_API_ENABLED"] = "true"
          get_settings.cache_clear()
          import app.main as main_mod
          importlib.reload(main_mod)
          engine = eval_engine()
          initialize_database(engine)
          cleanup_eval_tenants(engine)
          tenant_id = "eval_cd_http_identity"
          session = sessionmaker(bind=engine)()
          ensure_eval_tenant(session, tenant_id, tenant_id.lower())
          session.commit()
          session.close()

          def override_get_db():
              db = sessionmaker(bind=engine)()
              try:
                  yield db
              finally:
                  db.close()

          with (
              patch("app.main.Base.metadata.create_all"),
              patch("app.repositories.postgres.schema_migrations.ensure_runtime_schema"),
              patch("app.repositories.postgres.schema_migrations.provision_tenant_defaults"),
              patch("app.workflows.decision_trace_readiness.verify_decision_trace_readiness"),
              patch.dict(os.environ, {"ADMIN_ROLE": "admin", "ADMIN_API_KEY": "ci-admin-key"}, clear=False),
          ):
              get_settings.cache_clear()
              main_mod.app.dependency_overrides[get_db] = override_get_db
              with TestClient(main_mod.app) as client:
                  create = client.post(
                      f"/admin/tenants/{tenant_id}/end-customers",
                      headers={
                          "X-Admin-API-Key": "ci-admin-key",
                          "Origin": "http://testserver",
                          "Idempotency-Key": "http-identity-create",
                      },
                      json={
                          "customer_type": "private",
                          "private": {"display_name": "Identity Flow", "email": "identity@eval.test"},
                          "reason": "F1b identity",
                      },
                  )
                  assert create.status_code == 201, create.text
                  customer_id = create.json()["customer_id"]
                  contact_id = create.json().get("primary_contact_id")
                  identity = client.post(
                      f"/admin/tenants/{tenant_id}/end-customers/{customer_id}/identities",
                      headers={
                          "X-Admin-API-Key": "ci-admin-key",
                          "Origin": "http://testserver",
                          "Idempotency-Key": "http-identity-1",
                      },
                      json={
                          "owner_type": "contact",
                          "owner_id": contact_id,
                          "identity_type": "email",
                          "raw_value": "second@eval.test",
                          "verification_status": "verified",
                          "reason": "F1b identity create",
                      },
                  )
                  assert identity.status_code == 201, identity.text
                  print("HTTP_IDENTITY_CREATE_PASS", identity.status_code)
          cleanup_eval_tenants(engine)
          engine.dispose()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: customer-domain-f1-f1b-qualification-b433cba
          path: |
            customer-card-stateful-f1-rg-f1-20260729.json
            customer-card-stateful-f1-rg-f1-20260729.md
            f1b-http-contract.junit.xml
