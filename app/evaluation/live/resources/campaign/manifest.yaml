manifest_version: full-system-testbot-campaign-v1
description: Isolated full-system testbot campaign scenarios (synthetic Gmail)

campaigns:
  transport-smoke:
    default_mode: observe
    scenarios:
      - TBS01_lead_observe.yaml
      - TBS02_support_observe.yaml
      - TBS03_invoice_observe.yaml
      - TBS04_unknown_observe.yaml
      - TBS05_noisy_observe.yaml

  observe-core:
    default_mode: observe
    scenarios:
      - TBS01_lead_observe.yaml
      - TBS02_support_observe.yaml
      - TBS03_invoice_observe.yaml
      - TBS04_unknown_observe.yaml
      - TBS05_noisy_observe.yaml

  semi-auto-core:
    default_mode: semi_automatic
    scenarios:
      - TBSM01_lead_approve_reply.yaml
      - TBSM02_support_approve_reply.yaml
      - TBSM03_noisy_approve_reply.yaml
      - TBSM04_lead_reject.yaml
      - TBSM05_support_reject.yaml
      - TBSM06_duplicate_approve.yaml
      - TBSM07_stale_approve.yaml
      - TBSM08_unknown_negative_hold.yaml

  automatic-gmail-canary:
    default_mode: automatic
    scenarios:
      - TBA01_safe_lead_auto_reply.yaml
      - TBA02_unknown_auto_hold.yaml

  automatic-gmail-core:
    default_mode: automatic
    scenarios:
      - TBA01_safe_lead_auto_reply.yaml
      - TBA02_unknown_auto_hold.yaml
      - TBA03_safe_general_inquiry_auto_reply.yaml
      - TBA04_noisy_lead_auto_reply.yaml
      - TBA05_invoice_auto_hold.yaml
      - TBA06_support_complaint_auto_hold.yaml
      - TBA07_price_booking_commitment_hold.yaml
      - TBA08_sensitive_safety_hold.yaml
